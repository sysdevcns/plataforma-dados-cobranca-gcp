<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="seta" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#197099"/>
    </marker>
    <style>
      .titulo { font-size: 22px; font-weight: 700; fill: #04092C; }
      .sub { font-size: 13px; fill: #4a5568; }
      .faixa { font-size: 12px; font-weight: 700; fill: #ffffff; letter-spacing: .6px; }
      .caixa { fill: #ffffff; stroke: #197099; stroke-width: 1.5; rx: 8; }
      .caixa-escura { fill: #04092C; stroke: #04092C; rx: 8; }
      .caixa-ciano { fill: #e6f6fb; stroke: #00A0D2; stroke-width: 1.5; rx: 8; }
      .nome { font-size: 13px; font-weight: 700; fill: #04092C; }
      .nome-claro { font-size: 13px; font-weight: 700; fill: #ffffff; }
      .det { font-size: 11px; fill: #4a5568; }
      .det-claro { font-size: 11px; fill: #cfe8f3; }
      .fluxo { stroke: #197099; stroke-width: 1.8; fill: none; marker-end: url(#seta); }
      .fluxo-trans { stroke: #00A0D2; stroke-width: 1.8; fill: none; marker-end: url(#seta); stroke-dasharray: 6 4; }
      .rotulo { font-size: 11px; fill: #197099; font-weight: 600; }
      .lateral { font-size: 12px; font-weight: 700; fill: #04092C; }
      .lateral-det { font-size: 11px; fill: #4a5568; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="40" y="40" class="titulo">Plataforma de dados de cobrança no GCP: arquitetura proposta</text>
  <text x="40" y="62" class="sub">Fontes heterogêneas -> landing imutável -> BigQuery em três camadas com dbt -> consumo por MIS/BI, operação e IA. Transversais: orquestração, CI/CD, governança/LGPD e FinOps.</text>

  <!-- Faixas de colunas -->
  <rect x="40" y="85" width="200" height="26" fill="#04092C" rx="4"/><text x="140" y="103" class="faixa" text-anchor="middle">FONTES</text>
  <rect x="270" y="85" width="190" height="26" fill="#197099" rx="4"/><text x="365" y="103" class="faixa" text-anchor="middle">INGESTÃO</text>
  <rect x="490" y="85" width="150" height="26" fill="#197099" rx="4"/><text x="565" y="103" class="faixa" text-anchor="middle">LANDING</text>
  <rect x="670" y="85" width="300" height="26" fill="#00A0D2" rx="4"/><text x="820" y="103" class="faixa" text-anchor="middle">BIGQUERY + DBT</text>
  <rect x="1000" y="85" width="160" height="26" fill="#04092C" rx="4"/><text x="1080" y="103" class="faixa" text-anchor="middle">CONSUMO</text>

  <!-- Fontes -->
  <g>
    <rect x="40" y="125" width="200" height="46" class="caixa"/><text x="52" y="144" class="nome">PostgreSQL / MySQL</text><text x="52" y="160" class="det">sistemas de cobrança e CRM interno</text>
    <rect x="40" y="181" width="200" height="46" class="caixa"/><text x="52" y="200" class="nome">CRM via API REST</text><text x="52" y="216" class="det">tipo Pipedrive: deals, atividades</text>
    <rect x="40" y="237" width="200" height="46" class="caixa"/><text x="52" y="256" class="nome">Assinatura eletrônica</text><text x="52" y="272" class="det">tipo DocuSign: envelopes, webhooks</text>
    <rect x="40" y="293" width="200" height="46" class="caixa"/><text x="52" y="312" class="nome">Discador e bot</text><text x="52" y="328" class="det">webhooks de tentativas e resultados</text>
    <rect x="40" y="349" width="200" height="46" class="caixa"/><text x="52" y="368" class="nome">Planilhas CSV / Excel</text><text x="52" y="384" class="det">remessas e baixas dos credores</text>
    <rect x="40" y="405" width="200" height="46" class="caixa"/><text x="52" y="424" class="nome">Oracle legado</text><text x="52" y="440" class="det">extração incremental com janela do DBA</text>
  </g>

  <!-- Ingestão -->
  <g>
    <rect x="270" y="140" width="190" height="70" class="caixa"/>
    <text x="282" y="160" class="nome">Cloud Run Jobs (Python)</text>
    <text x="282" y="177" class="det">extratores por fonte: incremental,</text>
    <text x="282" y="191" class="det">paginação, retry, manifesto</text>
    <rect x="270" y="225" width="190" height="70" class="caixa"/>
    <text x="282" y="245" class="nome">Cloud Run + Pub/Sub</text>
    <text x="282" y="262" class="det">recebe webhooks (discador, bot,</text>
    <text x="282" y="276" class="det">assinatura), valida e enfileira</text>
    <rect x="270" y="310" width="190" height="70" class="caixa"/>
    <text x="282" y="330" class="nome">Cloud Functions / Transfer</text>
    <text x="282" y="347" class="det">arquivos SFTP e planilhas;</text>
    <text x="282" y="361" class="det">Datastream para CDC quando couber</text>
    <rect x="270" y="395" width="190" height="56" class="caixa"/>
    <text x="282" y="415" class="nome">Secret Manager</text>
    <text x="282" y="431" class="det">tokens e senhas fora do código</text>
  </g>

  <!-- Landing -->
  <g>
    <rect x="490" y="140" width="150" height="190" class="caixa-escura"/>
    <text x="502" y="162" class="nome-claro">Cloud Storage</text>
    <text x="502" y="180" class="det-claro">bucket de landing</text>
    <text x="502" y="202" class="det-claro">sistema/entidade/</text>
    <text x="502" y="216" class="det-claro">dt=AAAA-MM-DD/arquivo</text>
    <text x="502" y="238" class="det-claro">imutável, versionado,</text>
    <text x="502" y="252" class="det-claro">manifesto por carga,</text>
    <text x="502" y="266" class="det-claro">retenção por política,</text>
    <text x="502" y="280" class="det-claro">replay a qualquer momento</text>
    <text x="502" y="306" class="det-claro">LOAD DATA por partição</text>
    <text x="502" y="320" class="det-claro">para a camada Raw</text>
  </g>

  <!-- BigQuery camadas -->
  <g>
    <rect x="670" y="125" width="300" height="78" class="caixa-ciano"/>
    <text x="682" y="145" class="nome">RAW (Bronze): dataset restrito</text>
    <text x="682" y="162" class="det">tabelas como chegaram + staging (views): renomeia, tipa,</text>
    <text x="682" y="176" class="det">padroniza. Dado pessoal em claro só aqui (IAM + policy tags).</text>
    <text x="682" y="192" class="det">Testes de chave e freshness na origem.</text>

    <rect x="670" y="215" width="300" height="78" class="caixa-ciano"/>
    <text x="682" y="235" class="nome">CLEANSED (Silver): regras de negócio</text>
    <text x="682" y="252" class="det">aging e dias de atraso, régua de cobrança (tabela de referência),</text>
    <text x="682" y="266" class="det">status consolidado de parcela/acordo/contrato a partir dos fatos,</text>
    <text x="682" y="282" class="det">efetividade de contato por catálogo de resultados.</text>

    <rect x="670" y="305" width="300" height="92" class="caixa-ciano"/>
    <text x="682" y="325" class="nome">CURATED (Gold): pronto para consumo</text>
    <text x="682" y="342" class="det">fct_parcelas, fct_contatos, dim_clientes (CPF/e-mail em hash),</text>
    <text x="682" y="356" class="det">dim_contratos, mart_recuperacao_diaria,</text>
    <text x="682" y="370" class="det">mart_efetividade_canal_diaria. Particionado por data e</text>
    <text x="682" y="384" class="det">clusterizado pelos filtros do BI; incremental sem DML.</text>

    <rect x="670" y="409" width="300" height="42" class="caixa"/>
    <text x="682" y="427" class="nome">dbt Core: testes, docs, lineage, contratos</text>
    <text x="682" y="443" class="det">153 testes neste repositório; dbt build no orquestrador</text>
  </g>

  <!-- Consumo -->
  <g>
    <rect x="1000" y="125" width="160" height="56" class="caixa"/>
    <text x="1012" y="145" class="nome">MIS / BI</text>
    <text x="1012" y="161" class="det">Looker Studio, Power BI</text>
    <text x="1012" y="174" class="det">recuperação, aging, canal</text>
    <rect x="1000" y="193" width="160" height="56" class="caixa"/>
    <text x="1012" y="213" class="nome">Operação</text>
    <text x="1012" y="229" class="det">fila de cobrança do dia,</text>
    <text x="1012" y="242" class="det">canal e desconto da régua</text>
    <rect x="1000" y="261" width="160" height="78" class="caixa"/>
    <text x="1012" y="281" class="nome">IA</text>
    <text x="1012" y="297" class="det">Vertex AI Feature Store:</text>
    <text x="1012" y="310" class="det">propensão, melhor canal/hora</text>
    <text x="1012" y="323" class="det">embeddings de transcrições</text>
    <text x="1012" y="336" class="det">para LLM (RAG) e resumo</text>
    <rect x="1000" y="351" width="160" height="56" class="caixa"/>
    <text x="1012" y="371" class="nome">Credores</text>
    <text x="1012" y="387" class="det">extratos e prestação de</text>
    <text x="1012" y="400" class="det">contas por carteira</text>
  </g>

  <!-- Fluxos fontes -> ingestão -->
  <path d="M240,148 L270,165" class="fluxo"/>
  <path d="M240,428 L270,180" class="fluxo"/>
  <path d="M240,204 L270,175" class="fluxo"/>
  <path d="M240,260 L270,250" class="fluxo"/>
  <path d="M240,316 L270,262" class="fluxo"/>
  <path d="M240,372 L270,340" class="fluxo"/>
  <!-- ingestão -> landing -->
  <path d="M460,175 L490,200" class="fluxo"/>
  <path d="M460,260 L490,240" class="fluxo"/>
  <path d="M460,345 L490,280" class="fluxo"/>
  <!-- landing -> raw -->
  <path d="M640,235 L670,170" class="fluxo"/>
  <text x="600" y="345" class="rotulo">bq load</text>
  <!-- camadas -->
  <path d="M820,203 L820,215" class="fluxo-trans"/>
  <path d="M820,293 L820,305" class="fluxo-trans"/>
  <!-- curated -> consumo -->
  <path d="M970,340 L1000,153" class="fluxo"/>
  <path d="M970,345 L1000,221" class="fluxo"/>
  <path d="M970,350 L1000,300" class="fluxo"/>
  <path d="M970,355 L1000,379" class="fluxo"/>

  <!-- Transversais -->
  <rect x="40" y="480" width="1120" height="2" fill="#00A0D2"/>
  <text x="40" y="505" class="lateral">TRANSVERSAIS</text>

  <rect x="40" y="520" width="262" height="170" class="caixa"/>
  <text x="52" y="542" class="nome">Orquestração</text>
  <text x="52" y="560" class="det">Cloud Scheduler -> Cloud Run Jobs no início</text>
  <text x="52" y="574" class="det">(um job por fonte, dbt build ao final).</text>
  <text x="52" y="588" class="det">Cloud Composer (Airflow) quando houver</text>
  <text x="52" y="602" class="det">dependências entre fontes, SLAs e retries</text>
  <text x="52" y="616" class="det">com visibilidade para o time.</text>
  <text x="52" y="636" class="det">dbt source freshness como sensor antes</text>
  <text x="52" y="650" class="det">de transformar; alertas no Cloud Monitoring.</text>

  <rect x="326" y="520" width="262" height="170" class="caixa"/>
  <text x="338" y="542" class="nome">CI/CD</text>
  <text x="338" y="560" class="det">GitHub Actions: dbt parse + testes de</text>
  <text x="338" y="574" class="det">ingestão em todo PR (sem credenciais).</text>
  <text x="338" y="588" class="det">Slim CI com dataset efêmero por PR</text>
  <text x="338" y="602" class="det">(state:modified+) via Workload Identity.</text>
  <text x="338" y="616" class="det">Deploy: merge em main -> imagem do Cloud</text>
  <text x="338" y="630" class="det">Run + dbt build em prod. Infra como código</text>
  <text x="338" y="644" class="det">(Terraform) para datasets, buckets e IAM.</text>

  <rect x="612" y="520" width="262" height="170" class="caixa"/>
  <text x="624" y="542" class="nome">Governança e LGPD</text>
  <text x="624" y="560" class="det">Dado pessoal em claro só em Raw, com IAM</text>
  <text x="624" y="574" class="det">restrito e policy tags (coluna). Curated</text>
  <text x="624" y="588" class="det">entrega CPF/e-mail em hash com sal do</text>
  <text x="624" y="602" class="det">Secret Manager. Opt-out materializado.</text>
  <text x="624" y="616" class="det">Lineage do dbt + Dataplex/Data Catalog,</text>
  <text x="624" y="630" class="det">retenção por política, logs de acesso</text>
  <text x="624" y="644" class="det">auditados, base legal documentada.</text>

  <rect x="898" y="520" width="262" height="170" class="caixa"/>
  <text x="910" y="542" class="nome">FinOps</text>
  <text x="910" y="560" class="det">Particionar fatos por data e clusterizar</text>
  <text x="910" y="574" class="det">pelos filtros reais; staging como view.</text>
  <text x="910" y="588" class="det">maximum_bytes_billed por ambiente,</text>
  <text x="910" y="602" class="det">cotas por projeto, slot reservations só</text>
  <text x="910" y="616" class="det">com volume comprovado. Lifecycle do</text>
  <text x="910" y="630" class="det">bucket (Nearline/Coldline). Custo por</text>
  <text x="910" y="644" class="det">consulta e por mart no painel de FinOps.</text>

  <text x="40" y="712" class="lateral-det">Sidney Moraes · linkedin.com/in/sid-moraes · github.com/sysdevcns/plataforma-dados-cobranca-gcp</text>
</svg>
